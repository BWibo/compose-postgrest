services:
  postgrest-db:
    ports:
      - "5432:5432"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    networks:
      - postgrest-backend
    volumes:
      # Mount the directory, not the file: git pull swaps the Caddyfile for a new
      # inode, which a single-file bind mount never sees (reload would load the
      # stale file).
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - postgrest
      - swagger-ui

volumes:
  caddy_data:
  caddy_config:
